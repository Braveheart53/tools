# version: 1.1.0
# revision history (newest first)
#   1.1.0  2026-09-04  speedtest-cli commented out: its `speedtest` shim shadows the Ookla CLI on PATH
#   1.0.0  2026-09-04  initial mamba/conda environment for isp_speed_monitor.py 1.0.0
# ISP Speed Monitor — mamba/conda environment
#   mamba env create -f environment.yml
#   mamba activate isp-speed-monitor
#   python isp_speed_monitor.py
name: isp-speed-monitor
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - qtpy>=2.4
  - pyside6>=6.6
  - pyqtgraph>=0.13.3
  - numpy>=1.26
  - h5py>=3.10
  # OPTIONAL pure-python fallback back-end (rate-limited, no jitter/packet loss).
  # Leave it out when using the Ookla CLI: it installs a `speedtest` shim with the
  # same name that lands first on PATH inside the env (the monitor now skips it,
  # but there is no reason to have both).
  # - speedtest-cli>=2.1.3
  # optional: only needed to open the .vszh5 files in Veusz on the same machine
  # - veusz

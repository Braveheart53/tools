# ISP Speed Monitor — uv project file
#   uv sync                                  # creates .venv with Python 3.12 (downloads it if needed)
#   uv run isp_speed_monitor.py              # GUI
#   uv run isp_speed_monitor.py --headless --config campaign.json
# One-off without a project:  uv run --with qtpy,pyside6,pyqtgraph,numpy,h5py isp_speed_monitor.py
[project]
name = "isp-speed-monitor"
version = "1.2.0"
description = "Scheduled / random multi-endpoint ISP speed-test logger with qtpy GUI, SQLite and native Veusz export"
authors = [{ name = "W. Wallace", email = "wwallace@nrao.edu" }]
requires-python = ">=3.10"
dependencies = [
    "qtpy>=2.4",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26",
    "h5py>=3.10",
]

[project.optional-dependencies]
# optional pure-python fallback back-end:  uv sync --extra fallback
fallback = ["speedtest-cli>=2.1.3"]

[tool.uv]
package = false
